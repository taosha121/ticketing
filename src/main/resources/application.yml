spring:
  application:
    name: ticketing

  datasource:
    url: jdbc:postgresql://localhost:5432/ticketing
    username: ticketing
    password: ticketing

  jpa:
    hibernate:
      ddl-auto: validate   # 表结构由 Flyway 管理，JPA 只做校验，绝不自动改表
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: ticketing-dev-secret-key-must-be-at-least-32-chars
    expiration-ms: 86400000   # 24 小时
  scheduler:
    expiry-delay-ms: 60000    # 占座过期检查间隔（ms）

management:
  endpoints:
    web:
      exposure:
        include: health,info   # 只暴露必要端点
  endpoint:
    health:
      show-details: always     # 学习阶段显示 DB/Redis 各自健康状态
